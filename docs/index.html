<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiront — Toggle Claude Code modes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #e8eaf6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .tagline {
      font-size: 1.2rem;
      color: #7c3aed;
      font-weight: 400;
      margin-bottom: 1.75rem;
    }

    .description {
      font-size: 0.975rem;
      color: #c4b5fd;
      opacity: 0.65;
      max-width: 420px;
      line-height: 1.65;
      margin-bottom: 2.25rem;
    }

    .download {
      display: inline-block;
      background: #7c3aed;
      color: #ffffff;
      text-decoration: none;
      padding: 0.8rem 1.9rem;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 0.75rem;
    }

    .download:hover { background: #8b5cf6; transform: translateY(-1px); }
    .download:active { transform: translateY(0); }

    .version {
      font-size: 0.78rem;
      color: #7c3aed;
      opacity: 0.55;
      margin-bottom: 0.4rem;
    }

    .note {
      font-size: 0.78rem;
      color: #e8eaf6;
      opacity: 0.3;
      max-width: 340px;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.72rem;
      color: #4c1d95;
      opacity: 0.45;
    }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="icon">🔄</div>
  <h1>Kiront</h1>
  <p class="tagline">One-click Claude Code mode switching.</p>
  <p class="description">
    A macOS menu bar app that toggles between Anthropic and Kiro modes.
    Automatically manages gateway, settings, and configuration.
  </p>
  <a class="download" href="https://github.com/eng-kitchen/kiront/releases/latest/download/Kiront.dmg">
    ⬇&nbsp; Download for macOS
  </a>
  <p class="version">v{{VERSION}}</p>
  <p class="note">Right-click → Open on first launch &nbsp;·&nbsp; macOS 10.15+</p>
  <footer><a href="https://github.com/eng-kitchen/kiront">View on GitHub</a></footer>
</body>
</html>
